<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>포트폴리오 관리 | 스튜디오센터 — 하오디자인</title>
  <meta name="robots" content="noindex" />
  <link rel="preconnect" href="https://cdn.jsdelivr.net" />
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard-dynamic-subset.css" />
  <style>
    :root { --accent:#e83817; --ink:#17150f; --muted:#6e6a60; --line:rgba(23,21,15,.13); --bg2:#f6f4f0; --ease:cubic-bezier(.16,1,.3,1); }
    * { box-sizing:border-box; margin:0; padding:0; }
    body { font-family:"Pretendard",system-ui,sans-serif; color:var(--ink); background:#fff; line-height:1.5; -webkit-font-smoothing:antialiased; }
    .wrap { max-width:1100px; margin:0 auto; padding:clamp(32px,5vw,56px) clamp(18px,4vw,40px) 80px; }
    .top { display:flex; align-items:flex-end; justify-content:space-between; gap:16px; flex-wrap:wrap; border-bottom:2px solid var(--ink); padding-bottom:20px; }
    .top h1 { font-size:clamp(1.5rem,2.6vw,2rem); font-weight:800; letter-spacing:-.03em; }
    .top h1 span { color:var(--accent); }
    .top p { color:var(--muted); font-size:.9rem; margin-top:6px; }
    .actions { display:flex; gap:10px; }
    .btn { font:inherit; font-weight:700; font-size:.92rem; border-radius:10px; padding:11px 20px; cursor:pointer; border:1px solid var(--line); background:#fff; color:var(--ink); transition:.2s var(--ease); }
    .btn:hover { border-color:var(--ink); }
    .btn--primary { background:var(--accent); border-color:var(--accent); color:#fff; }
    .btn--primary:hover { background:var(--ink); border-color:var(--ink); }
    .note { margin:22px 0; padding:16px 18px; background:#fff7f4; border:1px solid rgba(232,56,23,.25); border-radius:12px; color:#7a3a2b; font-size:.88rem; line-height:1.7; }
    .note b { color:var(--accent); }
    .bar { display:flex; align-items:center; gap:14px; margin:24px 0 16px; flex-wrap:wrap; }
    .bar .count { font-weight:800; } .bar .count b { color:var(--accent); }
    .grid { display:grid; grid-template-columns:repeat(auto-fill,minmax(190px,1fr)); gap:16px; }
    .it { border:1px solid var(--line); border-radius:14px; overflow:hidden; background:#fff; transition:border-color .2s, box-shadow .2s; }
    .it.on { border-color:var(--accent); box-shadow:0 0 0 1px var(--accent); }
    .it__media { position:relative; aspect-ratio:3/4; overflow:hidden; background:var(--bg2); }
    .it__media img { width:100%; height:100%; object-fit:cover; }
    .it__badge { position:absolute; top:10px; left:10px; font-size:.7rem; font-weight:800; padding:4px 9px; border-radius:999px; background:rgba(255,255,255,.92); color:var(--muted); }
    .it.on .it__badge { background:var(--accent); color:#fff; }
    .it__b { padding:12px 14px 14px; }
    .it__b h3 { font-size:.98rem; font-weight:800; letter-spacing:-.02em; }
    .it__b .cat { font-size:.78rem; color:var(--muted); margin-top:3px; }
    .it__toggle { display:flex; align-items:center; gap:8px; margin-top:12px; font-size:.86rem; font-weight:700; cursor:pointer; user-select:none; }
    .it__toggle input { width:18px; height:18px; accent-color:var(--accent); cursor:pointer; }
    .saved { position:fixed; left:50%; bottom:28px; transform:translateX(-50%) translateY(20px); background:var(--ink); color:#fff; padding:13px 26px; border-radius:999px; font-weight:700; font-size:.9rem; opacity:0; pointer-events:none; transition:opacity .3s, transform .3s var(--ease); }
    .saved.show { opacity:1; transform:translateX(-50%) translateY(0); }
  </style>
</head>
<body>
  <div class="wrap">
    <div class="top">
      <div>
        <h1>포트폴리오 <span>관리</span></h1>
        <p>메인 노출을 체크하면 스튜디오센터 메인 포트폴리오에 표시됩니다.</p>
      </div>
      <div class="actions">
        <a class="btn" href="portfolio.html" target="_blank">포트폴리오 보기 ↗</a>
        <button class="btn" id="reset">기본값 복원</button>
        <button class="btn btn--primary" id="save">저장</button>
      </div>
    </div>

    <div class="note">
      ⚠ 지금 저장은 <b>이 브라우저(localStorage)</b>에만 적용되는 데모입니다. 라이브 사이트에서 <b>모든 방문자</b>에게 반영하려면 백엔드(Supabase) 연동이 필요합니다 — 디자인센터와 동일 방식. 원하시면 연동해 드립니다.
    </div>

    <div class="bar">
      <span class="count">메인 노출 <b id="onCount">0</b> / <span id="total">0</span></span>
      <button class="btn" id="allOn" style="padding:8px 14px;font-size:.85rem">전체 켜기</button>
      <button class="btn" id="allOff" style="padding:8px 14px;font-size:.85rem">전체 끄기</button>
    </div>

    <div class="grid" id="grid"></div>
  </div>
  <div class="saved" id="toast">저장되었습니다</div>

  <script src="js/portfolio.js?v=8"></script>
  <script>
  (function () {
    var $ = function (s, c) { return (c || document).querySelector(s); };
    var $$ = function (s, c) { return [].slice.call((c || document).querySelectorAll(s)); };
    // 현재 상태 = 저장분 우선, 없으면 기본값
    var works = (window.HAO_WORKS || []).map(function (w) { return Object.assign({}, w); });
    var grid = $('#grid');

    function count() {
      var on = works.filter(function (w) { return w.main; }).length;
      $('#onCount').textContent = on; $('#total').textContent = works.length;
    }
    function render() {
      grid.innerHTML = works.map(function (w, i) {
        return '<div class="it ' + (w.main ? 'on' : '') + '" data-i="' + i + '">' +
          '<div class="it__media"><span class="it__badge">' + (w.main ? '메인 노출' : '미노출') + '</span>' +
          '<img loading="lazy" src="' + HAO_imgPath(w.f) + '" alt="' + w.t + '" /></div>' +
          '<div class="it__b"><h3>' + w.t + '</h3><p class="cat">' + (w.c || '') + '</p>' +
          '<label class="it__toggle"><input type="checkbox" ' + (w.main ? 'checked' : '') + ' data-i="' + i + '" /> 메인 노출</label></div></div>';
      }).join('');
      count();
    }
    grid.addEventListener('change', function (e) {
      var cb = e.target.closest('input[type=checkbox]'); if (!cb) return;
      works[+cb.dataset.i].main = cb.checked;
      var it = cb.closest('.it'); it.classList.toggle('on', cb.checked);
      it.querySelector('.it__badge').textContent = cb.checked ? '메인 노출' : '미노출';
      count();
    });
    $('#allOn').addEventListener('click', function () { works.forEach(function (w) { w.main = true; }); render(); });
    $('#allOff').addEventListener('click', function () { works.forEach(function (w) { w.main = false; }); render(); });
    $('#save').addEventListener('click', function () {
      localStorage.setItem('hs_portfolio', JSON.stringify(works));
      var t = $('#toast'); t.classList.add('show'); setTimeout(function () { t.classList.remove('show'); }, 1800);
    });
    $('#reset').addEventListener('click', function () {
      if (!confirm('기본값으로 되돌릴까요? 저장한 메인 노출 설정이 초기화됩니다.')) return;
      localStorage.removeItem('hs_portfolio');
      works = (window.HAO_WORKS_DEFAULT || []).map(function (w) { return Object.assign({}, w); });
      render();
    });
    render();
  })();
  </script>
</body>
</html>
